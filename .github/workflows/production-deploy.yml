name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type deploy to authorize production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xlink-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'deploy' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, xlink-production]
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify production target and clean state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=/var/www/isp-billing-import
          test -d "$APP_PATH/.git" || test -f "$APP_PATH/.git"
          test -f "$APP_PATH/.env"
          test -f "$APP_PATH/artisan"
          php -v | head -1
          composer --version

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run release tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          TELESCOPE_ENABLED: false
        run: |
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force
          php artisan test --no-ansi
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear

      - name: Deploy tested main release through restricted root wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          printf '%s\n' "${GITHUB_SHA}" > "$GITHUB_WORKSPACE/.xlink-deploy-sha"
          sudo /usr/local/sbin/xlink-billing-deploy

      - name: Verify production HTTP health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8081/login >/dev/null
          echo 'Production login endpoint returned HTTP 200.'

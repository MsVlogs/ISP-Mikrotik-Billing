name: Inspect available self-hosted runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    steps:
      - name: Report runner identity and production target presence
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "machine=$(hostname -f 2>/dev/null || hostname)"
          if [ -d /var/www/isp-billing-import ] && [ -f /var/www/isp-billing-import/artisan ]; then
            echo 'production_app_path=present'
          else
            echo 'production_app_path=absent'
          fi
          if [ -f /var/www/isp-billing-import/.env ]; then
            echo 'production_env_file=present'
          else
            echo 'production_env_file=absent'
          fi
